<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="esp32-rss 管理">
  <defs>
    <linearGradient id="bg" x1="10" y1="2" x2="54" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD9E3"/>
      <stop offset=".55" stop-color="#FFB6CC"/>
      <stop offset="1" stop-color="#FF9BBB"/>
    </linearGradient>
    <linearGradient id="screen" x1="32" y1="18" x2="32" y2="51" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF9"/>
      <stop offset="1" stop-color="#FFF2E9"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <circle cx="15" cy="13" r="11" fill="#FFFFFF" opacity=".18"/>
  <!-- 小芽：给 RSS 阅读器一点生长感 -->
  <path d="M32 15.5c-.8-4.2-3.9-7.2-8.1-7.4.2 4.3 3.3 7.3 8.1 7.4Z" fill="#8CCFA6"/>
  <path d="M32 15.5c.8-4.2 3.9-7.2 8.1-7.4-.2 4.3-3.3 7.3-8.1 7.4Z" fill="#B6E7C6"/>
  <rect x="30.7" y="13.4" width="2.6" height="6.6" rx="1.3" fill="#6EBE8B"/>
  <!-- 屏幕 -->
  <rect x="9" y="20" width="46" height="33" rx="10" fill="#D97C9D" opacity=".45"/>
  <rect x="8.5" y="18" width="47" height="33" rx="10" fill="url(#screen)"/>
  <!-- 腮红 -->
  <circle cx="18.5" cy="39" r="3.1" fill="#FFC2D3"/>
  <circle cx="45.5" cy="39" r="3.1" fill="#FFC2D3"/>
  <!-- 眼睛 -->
  <circle cx="24.5" cy="33" r="2.9" fill="#5B3A3A"/>
  <circle cx="39.5" cy="33" r="2.9" fill="#5B3A3A"/>
  <circle cx="25.5" cy="31.9" r="1" fill="#FFFFFF"/>
  <circle cx="40.5" cy="31.9" r="1" fill="#FFFFFF"/>
  <!-- 微笑 -->
  <path d="M26.5 38.6c1.6 2.3 3.4 3.4 5.5 3.4s3.9-1.1 5.5-3.4" fill="none" stroke="#5B3A3A" stroke-width="2.2" stroke-linecap="round"/>
</svg>
