; PlatformIO Project Configuration File
;
; 双环境配置：同一份业务代码同时支持 ESP32-C3 与 ESP32-S3。
; 芯片差异（TFT 引脚、sdkconfig 板级项、flash 容量）通过各 env 独立管理：
;   - TFT 引脚：lib/ui_animation/ui_animation.c 中按 CONFIG_IDF_TARGET_* 条件编译
;   - 板级 sdkconfig：sdkconfig.defaults 共用 + sdkconfig.defaults.esp32c3 / sdkconfig.defaults.esp32s3 按芯片覆盖
;   - flash 大小：sdkconfig 中的 CONFIG_ESPTOOLPY_FLASHSIZE_* 与 board_upload.flash_size 必须一致

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
build_unflags = -fuse-cxa-atexit
; S3 使用 8MB 专用分区表（比共享表多一个 font 数据分区，用于存放中文子集字体）
board_build.partitions = partitions_s3.csv

; flash 容量已在 sdkconfig.defaults.esp32s3 中按 8MB 设定；若实际模组不同，
; 需同时改 CONFIG_ESPTOOLPY_FLASHSIZE_* 与这里的 board_upload.flash_size（两者必须相等）
; board_upload.flash_size = 4MB
; board_build.flash_mode  = dio

extra_scripts =
    pre:build_spiffs.py
    pre:build_font.py

; 代码使用 9.6 引入的 lv_obj_set_scrollable / LV_COLOR_FORMAT_DEFAULT，故锁定 9.6.x
lib_deps =
    lvgl/lvgl @ ~9.6.0

lib_ignore =
    lvgl

[env:esp32c3]
platform = espressif32
board = airm2m_core_esp32c3
framework = espidf
monitor_speed = 115200
build_unflags = -fuse-cxa-atexit
board_build.partitions = partitions.csv

; C3 只有 4MB flash，与 sdkconfig.defaults.esp32c3 中的 4MB 设置保持一致
board_upload.flash_size = 4MB
board_build.flash_mode  = dio

extra_scripts =
    pre:build_spiffs.py

; 与 esp32s3 环境相同的 LVGL 版本锁定
lib_deps =
    lvgl/lvgl @ ~9.6.0

lib_ignore =
    lvgl