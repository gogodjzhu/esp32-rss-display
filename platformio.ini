; ESP32-S3 固件构建配置
[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32 @ 6.13.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
build_unflags = -fuse-cxa-atexit
board_build.partitions = partitions_s3.csv
board_upload.flash_size = 8MB
extra_scripts =
    pre:build_spiffs.py
    pre:build_font.py
; 源码与依赖由 ESP-IDF 组件管理，禁止 LDF 再次收集本地库
lib_ldf_mode = off
lib_deps =
    lvgl/lvgl @ 9.6.0
lib_ignore =
    lvgl
