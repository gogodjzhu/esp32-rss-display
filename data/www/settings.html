<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RSS 新闻配置</title>
<link rel="stylesheet" href="/styles.css">
<style>
  .hdr-row { display:flex; gap:4px; margin-bottom:6px; align-items:center; }
  .hdr-row input { flex:1; margin:0; min-width:0; }
  .hdr-row input.k { flex:1; }
  .hdr-row input.v { flex:2; }
  .hdr-row button { width:auto; flex:none; padding:4px 8px; margin:0; }
  .btn-sm { padding:4px 10px; font-size:13px; width:auto; }
  .section-title { margin-top:16px; margin-bottom:8px; font-weight:bold; color:#bbb; }
  .help-text { font-size:12px; color:#888; margin-bottom:4px; }
</style>
</head>
<body>
<div class="card">
<h1>RSS 新闻配置</h1>
<div id="form-area">

<label>后端 API 根地址</label>
<input type="url" id="api_base_url" maxlength="255" placeholder="http://192.168.x.x:8080">
<label>设备标识</label>
<input type="text" id="device_id" maxlength="63" placeholder="test-device-001">
<div id="migration" class="help-text" style="display:none"></div>

<div class="section-title">HTTP Headers</div>
<div class="help-text">仅附加到后端 API 请求，不用于图片下载；最多 8 项</div>
<div id="headers-list"></div>
<button class="btn-sm" onclick="addHeader()">+ 添加 Header</button>

<div style="margin-top:16px;">
<button onclick="saveSettings()">保存并重启</button>
</div>
</div>

<div id="msg" style="display:none" class="status status-connected">
保存成功，正在重启，请稍候...
</div>
<div id="err" style="display:none" class="status status-disconnected"></div>
<div class="back"><a href="/">&larr; 返回</a></div>
</div>

<script>
var hdrs = [];

function renderHeaders() {
  var list = document.getElementById('headers-list');
  list.innerHTML = '';
  for (var i = 0; i < hdrs.length; i++) {
    var d = document.createElement('div');
    d.className = 'hdr-row';
    d.innerHTML =
      '<input class="k" placeholder="Header 名称" value="' + esc(hdrs[i].k) + '" oninput="updateHdr(' + i + ',this.value,null)">'
    + '<input class="v" placeholder="Header 值" value="' + esc(hdrs[i].v) + '" oninput="updateHdr(' + i + ',null,this.value)">'
    + '<button onclick="removeHeader(' + i + ')">删除</button>';
    list.appendChild(d);
  }
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function addHeader() {
  hdrs.push({k:'',v:''});
  renderHeaders();
}

function removeHeader(i) { hdrs.splice(i,1); renderHeaders(); }

function updateHdr(i, k, v) {
  if (k !== null) hdrs[i].k = k;
  if (v !== null) hdrs[i].v = v;
}

window.onload = function() {
  fetch('/api/settings')
    .then(function(r){ if (!r.ok) throw new Error('请求失败'); return r.json(); })
    .then(function(d){
      document.getElementById('api_base_url').value = d.api_base_url || '';
      document.getElementById('device_id').value = d.device_id || '';
      if (d.migration_required) {
        var hint = document.getElementById('migration');
        hint.style.display = 'block';
        hint.textContent = '请填写后端根地址。已保留的旧请求地址：' + d.legacy_next_url;
      }
      if (d.headers && Array.isArray(d.headers)) {
        hdrs = d.headers.map(function(h){ return {k:h.k||'',v:h.v||''}; });
      }
      renderHeaders();
    })
    .catch(function(){ renderHeaders(); });
};

function saveSettings() {
  var url = document.getElementById('api_base_url').value.trim();
  var device = document.getElementById('device_id').value.trim();
  if (!url || !device) { showErr('后端根地址和设备标识不能为空'); return; }

  var body = JSON.stringify({
    api_base_url: url,
    device_id: device,
    headers: hdrs.filter(function(h){ return h.k.trim(); })
  });

  fetch('/api/settings', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: body
  })
  .then(function(r){ if (!r.ok) throw new Error('请求失败'); return r.json(); })
  .then(function(d){
    if (d.ok) {
      document.getElementById('form-area').style.display = 'none';
      document.getElementById('msg').style.display = 'block';
    } else {
      showErr('保存失败');
    }
  })
  .catch(function(){ showErr('网络错误，请重试'); });
}

function showErr(msg) {
  var el = document.getElementById('err');
  el.textContent = msg;
  el.style.display = 'block';
}
</script>
</body>
</html>
